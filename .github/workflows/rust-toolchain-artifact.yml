name: Rust toolchain artifact

on:
  push:
    branches:
      - agent/rust-toolchain-artifact-20260823
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Create exact offline dependency bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          root=/tmp/rolap-offline
          mkdir -p "$root/crate/src" "$root/crate/.cargo"
          cat > "$root/crate/Cargo.toml" <<'TOML'
          [package]
          name = "general-native-validation"
          version = "0.1.0"
          edition = "2024"
          rust-version = "1.88"

          [dependencies]
          crc32fast = "1.5.0"
          lz4_flex = "0.13.1"
          rayon = "1.11.0"
          serde = { version = "1.0.228", features = ["derive"] }
          serde_json = "1.0.151"
          sha2 = "0.11.0"

          [dev-dependencies]
          tempfile = "3.27.0"
          TOML
          printf 'fn main() {}\n' > "$root/crate/src/main.rs"
          cd "$root/crate"
          cargo generate-lockfile
          cargo vendor vendor > .cargo/config.toml
          cargo check --locked --offline
          tar -C "$root/crate" -czf "$root/dependencies.tar.gz" \
            Cargo.toml Cargo.lock .cargo vendor

      - name: Package Rust toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          root=/tmp/rolap-offline
          toolchain_dir="$(dirname "$(dirname "$(rustup which --toolchain 1.88.0 rustc)")")"
          toolchain_name="$(basename "$toolchain_dir")"
          tar -C "$(dirname "$toolchain_dir")" -czf "$root/rust-1.88.0-toolchain.tar.gz" "$toolchain_name"
          printf '%s\n' "$toolchain_name" > "$root/toolchain-name.txt"

      - name: Package pinned ClickHouse
        shell: bash
        env:
          CLICKHOUSE_VERSION: "26.7.3.19"
          CLICKHOUSE_SHA256: "3338b507932c1616fda42d5fdd8ee6541bf2c3ecf8a6767ebf5814014f120c9f"
        run: |
          set -Eeuo pipefail
          root=/tmp/rolap-offline
          archive="/tmp/clickhouse-common-static-${CLICKHOUSE_VERSION}-amd64.tgz"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/ClickHouse/ClickHouse/releases/download/v${CLICKHOUSE_VERSION}-stable/clickhouse-common-static-${CLICKHOUSE_VERSION}-amd64.tgz" \
            -o "$archive"
          echo "${CLICKHOUSE_SHA256}  ${archive}" | sha256sum --check
          mkdir -p /tmp/clickhouse-dist
          tar -xzf "$archive" -C /tmp/clickhouse-dist
          binary="$(find /tmp/clickhouse-dist -type f -path '*/usr/bin/clickhouse' -print -quit)"
          test -n "$binary"
          cp "$binary" "$root/clickhouse"
          chmod +x "$root/clickhouse"
          sha256sum "$root/clickhouse" > "$root/clickhouse.sha256"

      - name: Upload toolchain
        uses: actions/upload-artifact@v4
        with:
          name: rust-1.88.0-toolchain
          path: |
            /tmp/rolap-offline/rust-1.88.0-toolchain.tar.gz
            /tmp/rolap-offline/toolchain-name.txt
          compression-level: 0

      - name: Upload dependencies
        uses: actions/upload-artifact@v4
        with:
          name: general-native-dependencies
          path: /tmp/rolap-offline/dependencies.tar.gz
          compression-level: 0

      - name: Upload ClickHouse
        uses: actions/upload-artifact@v4
        with:
          name: clickhouse-26.7.3.19
          path: |
            /tmp/rolap-offline/clickhouse
            /tmp/rolap-offline/clickhouse.sha256
          compression-level: 0
